<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake — بازی مار</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>بازی مار</h1>
    <div class="info">امتیاز: <span id="score">0</span> — رکورد: <span id="best">0</span></div>
    <canvas id="game" width="400" height="400" tabindex="0"></canvas>
    <div class="controls">
      <button id="start">شروع / ریست</button>
      <label><input id="speed" type="range" min="4" max="14" value="8"> سرعت</label>
    </div>
    <footer>از ←↑→↓ برای حرکت استفاده کن یا روی دکمه‌های لمسی کلیک کن.</footer>
  </main>
  <script src="snake.js"></script>
</body>
</html>
